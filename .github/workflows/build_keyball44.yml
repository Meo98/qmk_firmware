name: Build Keyball44 KB2040 Firmware
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'
      - name: Checkout QMK Firmware
        uses: actions/checkout@v4
      - name: Fix Python 3.14 ast.Num Bug
        run: |
          find lib/python/qmk -type f -name "math.py" -exec sed -i 's/ast\.Num/ast\.Constant/g' {} +
          find lib/python/qmk -type f -name "math.py" -exec sed -i 's/node\.n/node\.value/g' {} +
      - name: Deploy submodules
        run: qmk git-submodule -f
      - name: Build targeted firmware
        run: qmk compile -kb keyball/keyball44 -km via
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: keyball44-firmware
          path: '*.uf2'
